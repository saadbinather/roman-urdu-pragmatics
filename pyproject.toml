[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-urdu-pragmatics-pilot"
version = "0.1.0"
description = "Reproducible pilot study of pragmatic intent classification across English and Roman Urdu"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
inference = ["accelerate>=0.30", "torch>=2.2", "transformers>=4.45,<5"]
plots = ["matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
